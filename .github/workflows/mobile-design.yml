name: Improve Mobile Website Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Use the exact uploaded JMD logo asset.
          s = s.replace('assets/jmd-logo.png', 'assets/jmd-logo.webp')
          s = s.replace('assets/jmd-logo-official.svg', 'assets/jmd-logo.webp')
          s = s.replace('assets/jmd-logo.svg', 'assets/jmd-logo.webp')
          s = s.replace('BOOK A CONSULTATION', 'CONTACT')

          css = """
          @media (max-width:800px) {
            body{overflow-x:hidden}
            .container{width:calc(100% - 30px)}
            nav{padding:8px 0;position:absolute}
            .nav{justify-content:space-between}
            .brand{gap:7px;min-width:0}
            .brand img{width:42px !important;height:42px !important;object-fit:contain;flex:none;background:transparent !important}
            .brand span{font-size:14px;line-height:1.1;white-space:nowrap}
            .brand small{font-size:5.5px;letter-spacing:.8px}
            .links,.navbtn{display:none !important}
            .mobile-menu-btn{display:flex !important;width:38px;height:38px;border:1px solid rgba(255,255,255,.35);background:rgba(8,21,37,.35);color:#fff;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border-radius:2px}
            .hero{min-height:600px !important}
            .hero-content{padding-top:64px}
            .eyebrow{font-size:9px;letter-spacing:2px;margin-bottom:12px}
            .hero h1{font-size:42px !important;line-height:1.05;margin-bottom:16px}
            .hero p{font-size:14px;line-height:1.5;margin-bottom:22px}
            .buttons{display:grid;grid-template-columns:1fr;gap:8px}
            .primary,.outline{width:100%;text-align:center;padding:13px 16px}
            .stats{padding:13px 0}.statsgrid{grid-template-columns:1fr 1fr !important;gap:0}.stat:nth-child(n+3){display:none}.stat{padding:8px 5px}.stat strong{font-size:22px}.stat span{font-size:10px}
            section{padding:48px 0}.aboutgrid,.whygrid{grid-template-columns:1fr;gap:25px}.aboutimg{height:190px !important}.section-title{font-size:32px !important;line-height:1.12}.section-text{font-size:14px;line-height:1.55}.aboutbox{margin-top:17px;padding:16px}
            .servicesgrid{grid-template-columns:1fr !important;gap:9px;margin-top:22px}.service{padding:17px}.service .num{margin-bottom:7px;font-size:9px}.service h3{font-size:19px;line-height:1.15}.service p{font-size:12px;line-height:1.45}
            .features{grid-template-columns:1fr !important;gap:16px}.feature{padding-top:13px}.feature h3{font-size:16px;margin:5px 0}.feature p{font-size:12px;line-height:1.45}.industrylist{gap:6px;margin-top:22px}.industry{padding:7px 9px;font-size:11px}
            .cta h2{font-size:36px}.cta p{font-size:13px}.form{grid-template-columns:1fr !important;gap:8px;margin-top:22px}.form textarea,.form button{grid-column:auto}.form input,.form select,.form textarea{padding:12px;font-size:14px}
            footer{padding:38px 0 18px}.footgrid{grid-template-columns:1fr !important;gap:22px}.wa{right:14px;bottom:14px;width:52px;height:52px}
            .mobile-menu{display:none;position:absolute;top:58px;left:0;right:0;background:rgba(5,14,24,.99);border-top:1px solid rgba(255,255,255,.12);padding:5px 15px 9px;box-shadow:0 15px 30px rgba(0,0,0,.3)}
            .mobile-menu.open{display:block}
            .mobile-category{border-bottom:1px solid rgba(255,255,255,.1)}.mobile-category:last-child{border-bottom:0}
            .mobile-category > button,.mobile-category > a{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 4px;background:none;border:0;color:#fff;font:600 14px 'DM Sans',sans-serif;text-align:left;cursor:pointer}
            .mobile-sub{display:none;padding:0 4px 8px}.mobile-sub.open{display:block}.mobile-sub a{display:block;color:#aeb6c1;padding:7px 4px;font-size:12px}.mobile-sub a:hover{color:var(--gold2)}
          }
          @media (min-width:801px){.mobile-menu-btn,.mobile-menu{display:none !important}}
          """
          s = s.replace('</style>', css + '</style>', 1)

          start = s.find('<div class="mobile-menu" id="mobileMenu">')
          end = s.find('</div>\n      <script>', start)
          if start != -1 and end != -1:
              end += len('</div>')
              menu = '''<div class="mobile-menu" id="mobileMenu">
                <div class="mobile-category"><a href="#about" onclick="closeMobileMenu()">About <span>›</span></a></div>
                <div class="mobile-category"><a href="#why" onclick="closeMobileMenu()">Why Us <span>›</span></a></div>
                <div class="mobile-category"><button type="button" onclick="toggleServices()">Services <span id="servicesArrow">+</span></button>
                  <div class="mobile-sub" id="mobileServices">
                    <a href="#services" onclick="closeMobileMenu()">All Services</a>
                    <a href="#services" onclick="closeMobileMenu()">External Auditing</a>
                    <a href="#services" onclick="closeMobileMenu()">Internal Auditing</a>
                    <a href="#services" onclick="closeMobileMenu()">Forensic Audit</a>
                    <a href="#services" onclick="closeMobileMenu()">Tax & Compliance</a>
                  </div>
                </div>
                <div class="mobile-category"><a href="#industries" onclick="closeMobileMenu()">Industries <span>›</span></a></div>
                <div class="mobile-category"><button type="button" onclick="toggleContact()">Contact <span id="contactArrow">+</span></button>
                  <div class="mobile-sub" id="mobileContact">
                    <a href="mailto:Info@JMDaudit.com">✉ Info@JMDaudit.com</a>
                    <a href="https://wa.me/96171010297" target="_blank" rel="noopener">WhatsApp +961 71 01 02 97</a>
                  </div>
                </div>
              </div>'''
              s = s[:start] + menu + s[end:]

          if 'function toggleContact()' not in s:
              s = s.replace('</script>', "function toggleContact(){var e=document.getElementById('mobileContact'),a=document.getElementById('contactArrow');e.classList.toggle('open');a.textContent=e.classList.contains('open')?'−':'+'}\n              </script>", 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Use exact uploaded logo and polish mobile layout'
          git push
