name: Improve Mobile Website Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          css = """
          @media (max-width:800px) {
            body{overflow-x:hidden}
            .container{width:calc(100% - 30px)}
            nav{padding:10px 0}
            .links,.navbtn{display:none}
            .brand{gap:8px}
            .brand img{width:64px !important;height:64px !important;object-fit:contain}
            .brand span{font-size:15px;line-height:1.1}
            .brand small{font-size:6px;letter-spacing:1px}
            .hero{min-height:600px !important}
            .hero-content{padding-top:70px}
            .hero h1{font-size:44px !important;line-height:1.05}
            .hero p{font-size:15px;line-height:1.5}
            .buttons{display:grid;grid-template-columns:1fr;gap:10px}
            .primary,.outline{width:100%;text-align:center}
            .stats{padding:15px 0}
            .statsgrid{grid-template-columns:1fr 1fr !important;gap:0}
            .stat:nth-child(n+3){display:none}
            section{padding:52px 0}
            .aboutgrid,.whygrid{grid-template-columns:1fr;gap:28px}
            .aboutimg{height:210px !important}
            .section-title{font-size:33px !important}
            .servicesgrid{grid-template-columns:1fr 1fr !important;gap:10px;margin-top:24px}
            .service{padding:16px}
            .service h3{font-size:18px;line-height:1.15}
            .service p{font-size:12px;line-height:1.45}
            .features{grid-template-columns:1fr !important;gap:18px}
            .industrylist{gap:7px;margin-top:24px}
            .industry{padding:7px 10px;font-size:11px}
            .cta h2{font-size:38px}
            .form{grid-template-columns:1fr !important;gap:9px}
            .form textarea,.form button{grid-column:auto}
            .footgrid{grid-template-columns:1fr !important;gap:24px}
            .wa{right:15px;bottom:15px;width:54px;height:54px}
          }
          """
          marker = '</style>'
          s = s.replace(marker, css + marker, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix mobile responsive layout'
          git push
